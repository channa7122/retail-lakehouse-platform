[project]
name = "retail-lakehouse-platform"
version = "0.1.0"
description = "Enterprise Lakehouse platform with Airflow, PySpark, Delta Lake, and dbt"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "dbt-core>=1.8.0",
    "dbt-spark>=1.8.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.1",
    "faker>=25.0.0",
    "streamlit>=1.65.0",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "sqlfluff>=3.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.sqlfluff.core]
dialect = "sparksql"
templater = "dbt"
max_line_length = 88
