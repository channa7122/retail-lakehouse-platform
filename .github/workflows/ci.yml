name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync

      - name: Lint Core Spark & Scripts (Ruff)
        run: uv run ruff check spark/ scripts/ dashboard.py

      - name: Validate Pipeline Script Syntax
        run: uv run python -m py_compile spark/jobs/raw_to_bronze.py spark/jobs/bronze_to_silver.py spark/jobs/silver_to_gold.py